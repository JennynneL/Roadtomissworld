<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5EEF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171A3D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Starlit Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: a storybook page. The illustrated garden is the picture, Mochi's speech bubble is the caption, today's small tasks are sticker cards underneath. */
:root{
  --bg:#F5EEF8; --bg-2:#FCEFF3; --surface:#FFFDFB; --surface-2:#F4ECF5; --ink:#3D3450; --muted:#7D7192; --line:#EBDDE8; --outline:#8A5A4A;
  --night:#23285E; --star:#FFD978; --star-soft:#FFF3CF; --sakura:#F4A9C0; --sakura-soft:#FDE6EE; --leaf:#93CC86; --leaf-soft:#E5F4DD;
  --water:#8FCBF0; --water-soft:#E2F2FC; --coffee:#C08A6A; --coffee-soft:#F8E8DE; --tulip:#F28FA9; --lilac:#B8A8EC; --lilac-soft:#EEE8FD; --bad:#D9607F;
  --accent:#E97FA0; --accent-ink:#FFFFFF; --accent-2:#7B82D6;
  --shadow:0 2px 0 rgba(138,90,74,.08),0 10px 24px rgba(91,63,104,.08);
  --font-display:"Gaegu","Comic Neue","Chalkboard SE","Marker Felt",cursive;
  --font-body:"Nunito","Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171A3D; --bg-2:#221F4B; --surface:#23285A; --surface-2:#2E3470; --ink:#F3EEFF; --muted:#B5AEDB; --line:#383F80; --outline:#E8C3A9;
  --star-soft:#3E3A2C; --sakura-soft:#4A2E4E; --leaf-soft:#244236; --water-soft:#203B5E; --coffee-soft:#40302C; --lilac-soft:#353064;
  --accent:#F4A3BE; --accent-ink:#24183A; --accent-2:#AEB4FF; --bad:#F59AB2;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#171A3D; --bg-2:#221F4B; --surface:#23285A; --surface-2:#2E3470; --ink:#F3EEFF; --muted:#B5AEDB; --line:#383F80; --outline:#E8C3A9;
  --star-soft:#3E3A2C; --sakura-soft:#4A2E4E; --leaf-soft:#244236; --water-soft:#203B5E; --coffee-soft:#40302C; --lilac-soft:#353064;
  --accent:#F4A3BE; --accent-ink:#24183A; --accent-2:#AEB4FF; --bad:#F59AB2;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.3); color-scheme:dark;
}
:root{padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%) fixed;background-color:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--accent-2);outline-offset:2px;border-radius:12px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(100px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--font-display);margin:0;font-weight:700;letter-spacing:0;text-wrap:balance;line-height:1.1}
h1{font-size:2.1rem}
h2{font-size:1.45rem}
.muted{color:var(--muted)} .small{font-size:.84rem} .num{font-variant-numeric:tabular-nums}
.sub-h{font-family:var(--font-display);font-size:1.12rem;color:var(--muted);font-weight:400}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px}
.datepill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:6px 12px;font-family:var(--font-display);font-size:1.15rem;font-weight:700;box-shadow:var(--shadow);border:1.5px solid var(--line)}
.card{background:var(--surface);border-radius:26px;padding:16px;box-shadow:var(--shadow);border:1.5px solid var(--line);min-width:0}
.card+.card,.stack>*+*{margin-top:14px}
.card>h2{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.garden{border-radius:30px;overflow:hidden;box-shadow:var(--shadow);border:2px solid var(--outline);background:var(--surface);position:relative}
.garden svg{display:block;width:100%;height:auto}
.bubble{position:relative;margin:-6px 14px 0;background:var(--surface);border:2px solid var(--outline);border-radius:22px;padding:10px 14px 10px 52px;font-family:var(--font-display);font-size:1.18rem;line-height:1.2;box-shadow:var(--shadow);z-index:1}
.bubble svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:38px;height:38px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:.8rem;font-weight:800;background:var(--surface-2);white-space:nowrap;border:1.2px solid var(--line)}
.chip svg{width:15px;height:15px}
.chip.leaf{background:var(--leaf-soft)} .chip.water{background:var(--water-soft)} .chip.sakura{background:var(--sakura-soft)} .chip.star{background:var(--star-soft)} .chip.coffee{background:var(--coffee-soft)} .chip.lilac{background:var(--lilac-soft)}
.task{display:grid;grid-template-columns:48px minmax(0,1fr);gap:4px 12px;align-items:start}
.task .ic{width:48px;height:48px;border-radius:18px;display:grid;place-items:center;border:1.5px solid var(--line)}
.task .ic svg{width:34px;height:34px}
.task .body{min-width:0}
.task .ttl{font-family:var(--font-display);font-weight:700;font-size:1.35rem;line-height:1.1;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.task .ttl .num{font-family:var(--font-body);font-size:.84rem;font-weight:800;color:var(--muted)}
.task .sub{font-size:.86rem;color:var(--muted);margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.mt{margin-top:10px}
.btn{border:1.5px solid var(--line);background:var(--surface-2);padding:9px 15px;border-radius:999px;font-weight:800;font-size:.88rem;min-height:40px;transition:transform .12s ease}
.btn:active{transform:scale(.94)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 rgba(138,90,74,.18)}
.btn.on{background:var(--accent-2);border-color:var(--accent-2);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:.82rem}
.btn:disabled{opacity:.5}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:999px;overflow-x:auto;border:1.5px solid var(--line)}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 10px;font-weight:800;font-size:.86rem;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.meter{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:8px;border:1.2px solid var(--line)}
.meter i{display:block;height:100%;border-radius:999px;background:var(--water);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 6px,transparent 6px 12px)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;font-weight:800;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);min-width:0}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr))}
textarea{resize:vertical}
.scale{display:flex;gap:6px}
.scale button{flex:1;border:1.5px solid var(--line);border-radius:14px;background:var(--surface-2);padding:8px 0;font-weight:800;min-height:38px}
.scale button[aria-pressed="true"]{background:var(--coffee);color:#fff;border-color:var(--coffee)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:2px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));border-radius:24px 24px 0 0}
.nav div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:0;padding:5px 0 4px;font-family:var(--font-display);font-size:1rem;font-weight:700;color:var(--muted);border-radius:16px}
.nav button svg{width:30px;height:30px}
.nav button[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.banner{border-radius:20px;padding:12px 14px;font-weight:700;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1.5px solid var(--line)}
.banner.star{background:var(--star-soft)} .banner.sakura{background:var(--sakura-soft)} .banner.lilac{background:var(--lilac-soft)}
.timerbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--night);color:#fff;border-radius:22px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;box-shadow:var(--shadow);border:2px solid #F3D489}
.timerbar b{font-family:var(--font-display);font-size:1.8rem;font-variant-numeric:tabular-nums;line-height:1}
.timerbar .btn{background:var(--star);color:#3D3450;border-color:var(--star)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-family:var(--font-display);font-size:1rem;color:var(--muted);padding:2px 0}
.cal button{border:0;background:transparent;aspect-ratio:1;border-radius:50%;font-weight:800;font-size:.86rem;position:relative;max-width:100%}
.cal button.out{opacity:.3}
.cal button.per{background:var(--bad);color:#fff}
.cal button.pred{box-shadow:inset 0 0 0 2px var(--bad);color:var(--bad)}
.cal button.pms::after{content:"";position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--lilac)}
.cal button.today{outline:2px dashed var(--ink);outline-offset:-2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.flash{border-radius:22px;background:var(--sakura-soft);border:2px dashed var(--line);padding:22px 16px;text-align:center;min-height:160px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.flash .front{font-family:var(--font-display);font-size:2rem}
.flash .back{font-size:1.05rem}
.chart svg{width:100%;height:auto;display:block}
.list{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--surface-2);min-width:0;border:1.2px solid var(--line)}
.item .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(35,40,94,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:30px 30px 0 0;border:2px solid var(--line);border-bottom:0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h2{margin-bottom:12px}
.sheet .actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--night);color:#FFF6DA;padding:9px 18px;border-radius:999px;font-family:var(--font-display);font-size:1.15rem;font-weight:700;z-index:60;max-width:calc(100% - 32px);text-align:center;border:2px solid #F3D489}
.wc{font-variant-numeric:tabular-nums;font-weight:800}
@media (prefers-reduced-motion:no-preference){
  .twinkle{animation:tw 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes tw{50%{opacity:.45;transform:scale(.85)}}
  .rain path{animation:rain 1.1s linear infinite}
  @keyframes rain{from{transform:translateY(-6px);opacity:0}30%{opacity:1}to{transform:translateY(16px);opacity:0}}
  .sway{animation:sway 4s ease-in-out infinite;transform-origin:center bottom;transform-box:fill-box}
  @keyframes sway{50%{transform:rotate(2.5deg)}}
  .firefly{animation:fly 5s ease-in-out infinite}
  @keyframes fly{0%,100%{transform:translate(0,0);opacity:.3}50%{transform:translate(6px,-8px);opacity:1}}
  .petalfall{animation:fall 6s linear infinite}
  @keyframes fall{from{transform:translate(0,-20px);opacity:0}15%{opacity:1}to{transform:translate(30px,60px);opacity:0}}
  .shoot{animation:shoot 5s ease-in infinite;stroke-dasharray:60;stroke-dashoffset:60}
  @keyframes shoot{0%,70%{stroke-dashoffset:60;opacity:0}80%{opacity:1}100%{stroke-dashoffset:-60;opacity:0}}
  .sheet{animation:up .25s cubic-bezier(.2,.9,.3,1.2)}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="timer-host"></div>
  <main id="view"></main>
</div>
<nav class="nav" aria-label="Sections"><div id="nav-btns"></div></nav>
<div id="sheet-host"></div>
<div id="toast-host"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
"use strict";
/* ================= data ================= */
const KEY="starlit-garden-v1";
const PLAN_START="2026-10-26";
const DEFAULTS={
  version:1,
  settings:{bottleMl:710,bottles:3,steps:8000,bed:"23:00",wake:"07:00",coffeePrice:3800,cycleLen:31,periodLen:6,
    ieltsDate:"2026-12-31",ieltsTentative:true,ieltsTarget:8.0,topikDate:"2027-04-10",topikRegStart:"2027-01-26",topikRegEnd:"2027-02-01",
    krMin:30,enMin:45,startDate:"2026-10-26",lastBackup:null},
  days:{},
  periods:[],
  cards:[],essays:[],session:null
};
let D=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY)||"null");if(r&&r.version)return{...structuredClone(DEFAULTS),...r,settings:{...DEFAULTS.settings,...r.settings}}}catch(_){}return structuredClone(DEFAULTS)}
let storageOk=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){storageOk=false;toast("Couldn't save on this phone. Storage may be full or blocked.")}}
const S={tab:"garden",sheet:null,studyTab:"ko",review:null,calMonth:null};

/* ================= utils ================= */
const pad=n=>String(n).padStart(2,"0");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function ymd(y,m,d){const t=new Date(Date.UTC(y,m-1,d));return t.toISOString().slice(0,10)}
function parseD(s){const[y,m,d]=s.split("-").map(Number);return{y,m,d}}
function addDays(s,n){const{y,m,d}=parseD(s);return ymd(y,m,d+n)}
function daysBetween(a,b){const A=parseD(a),B=parseD(b);return Math.round((Date.UTC(B.y,B.m-1,B.d)-Date.UTC(A.y,A.m-1,A.d))/864e5)}
function today(){const d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function dow(s){const{y,m,d}=parseD(s);return new Date(Date.UTC(y,m-1,d)).getUTCDay()}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function fmtD(s,yr){const{y,m,d}=parseD(s);return`${d} ${MON[m-1]}${yr?" "+y:""}`}
function won(n){return"₩"+Math.round(n).toLocaleString("en-US")}
function tmin(t){if(!t)return null;const[h,m]=t.split(":").map(Number);return h*60+m}
function hhmm(min){min=((min%1440)+1440)%1440;return`${pad(Math.floor(min/60))}:${pad(min%60)}`}
function getDay(d){return D.days[d]||{}}
function setDay(d,patch){D.days[d]={...getDay(d),...patch};save();render()}
function toast(msg){const h=document.getElementById("toast-host");h.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML="",2400)}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function* range(a,b){for(let d=a;d<=b;d=addDays(d,1))yield d}

/* ================= coffee ================= */
function coffeeRule(d){
  const w=Math.floor(daysBetween(PLAN_START,d)/7),wd=dow(d);
  if(w<0)return{allowed:1,week:0,label:"Before the plan starts"};
  if(w===0)return{allowed:[1,3,5].includes(wd)?1:0,week:1};
  if(w===1)return{allowed:[1,4].includes(wd)?1:0,week:2};
  if(w===2){const ws=addDays(PLAN_START,14);let used=0;for(let i=0;i<7;i++){const x=addDays(ws,i);if(x!==d&&(getDay(x).coffee||0)>0)used++}return{allowed:used?0:1,week:3,flex:true}}
  return{allowed:0,week:w+1};
}
const isTeaDay=d=>[2,6].includes(dow(d));
function coffeeStats(){
  let free=0,saved=0,logged=0;const t=today();
  for(const[d,v]of Object.entries(D.days)){if(d>t||v.coffee==null)continue;logged++;if(v.coffee===0)free++;saved+=Math.max(0,1-v.coffee)*D.settings.coffeePrice}
  let streak=0;let d=getDay(t).coffee==null?addDays(t,-1):t;
  while(getDay(d).coffee===0){streak++;d=addDays(d,-1)}
  return{free,saved,logged,streak};
}
function coffeeStage(free){const th=[0,2,6,12,20,30];let s=0;th.forEach((v,i)=>{if(free>=v)s=i});return s}
const COFFEE_STAGES=["Seed","Sprout","Little plant","Bushy","Flowering","Coffee cherries!"];

/* ================= cycle ================= */
function periodsSorted(){return D.periods.slice().sort((a,b)=>a.start<b.start?-1:1)}
function periodEnd(p){if(p.end)return p.end;const cap=addDays(p.start,9),t=today();return cap<t?cap:t}
function inPeriod(d){return D.periods.some(p=>d>=p.start&&d<=periodEnd(p))}
function openPeriod(){return D.periods.find(p=>!p.end)}
function avgCycle(){const ps=periodsSorted();const diffs=[];for(let i=1;i<ps.length;i++){const g=daysBetween(ps[i-1].start,ps[i].start);if(g>=18&&g<=45)diffs.push(g)}const last=diffs.slice(-6);return last.length?Math.round(last.reduce((a,b)=>a+b,0)/last.length):D.settings.cycleLen}
function avgLen(){const ps=periodsSorted().filter(p=>p.end);if(!ps.length)return D.settings.periodLen;const l=ps.slice(-6).map(p=>daysBetween(p.start,p.end)+1);return Math.round(l.reduce((a,b)=>a+b,0)/l.length)}
function nextPeriod(){const ps=periodsSorted();if(!ps.length)return null;const last=ps[ps.length-1];let start=addDays(last.start,avgCycle());const t=today();
  if(inPeriod(t)&&last.start<=t)start=addDays(last.start,avgCycle());
  return{start,end:addDays(start,avgLen()-1),pmsStart:addDays(start,-4),late:start<t&&!inPeriod(t)?daysBetween(start,t):0}}
function cycleDayOf(d){const ps=periodsSorted().filter(p=>p.start<=d);if(!ps.length)return null;return daysBetween(ps[ps.length-1].start,d)+1}

/* ================= sleep / study / walk ================= */
const bedLate=t=>{const m=tmin(t);if(m==null)return null;return((m-1200+1440)%1440)};/* minutes after 20:00 */
function bedOnTime(t){const v=bedLate(t);return v!=null&&v<=bedLate(D.settings.bed)+15}
function wakeOnTime(t){const m=tmin(t);return m!=null&&m<=tmin(D.settings.wake)+15}
function sleepHours(v){if(!v.sleepAt||!v.wakeAt)return null;let a=tmin(v.sleepAt),b=tmin(v.wakeAt);let dur=b-a;if(dur<=0)dur+=1440;return dur/60}
function counts(){
  let walk=0,ko=0,en=0,bed=0,wake=0;const t=today(),s=D.settings;
  for(const[d,v]of Object.entries(D.days)){if(d>t)continue;if((v.steps||0)>=s.steps)walk++;if((v.krMin||0)>=15||(v.kr&&(v.kr.vocab||v.kr.grammar||v.kr.speak)))ko++;if((v.enMin||0)>=20)en++;if(bedOnTime(v.sleepAt))bed++;if(wakeOnTime(v.wakeAt))wake++}
  return{walk,ko,en,bed,wake,essays:D.essays.length};
}
function recentBedStars(){let n=0;const t=today();for(let i=0;i<14;i++){if(bedOnTime(getDay(addDays(t,-i)).sleepAt))n++}return n}

function dueCards(deck){const t=today();return D.cards.filter(c=>c.deck===deck&&c.due<=t)}
function grade(card,g){/* g: 0 again,1 hard,2 good,3 easy */
  let{interval=0,ease=2.5,reps=0}=card;
  if(g===0){reps=0;interval=0;ease=Math.max(1.3,ease-.2)}
  else{reps++;if(reps===1)interval=g===3?3:1;else if(reps===2)interval=g===1?2:g===3?6:4;else interval=Math.round(interval*(g===1?1.2:g===3?ease*1.3:ease));ease=Math.max(1.3,ease+(g===1?-.15:g===3?.15:0))}
  card.interval=interval;card.ease=ease;card.reps=reps;card.due=addDays(today(),interval);card.last=today();
}

function mochiSays(){
  const s=D.settings,t=today(),v=getDay(t),h=new Date().getHours(),r=coffeeRule(t);
  if(inPeriod(t))return"Rainy day in the garden. Rest, warm water, and be kind to yourself.";
  if(D.session)return"I'm cheering for you. Keep going!";
  if(h>=23||h<5)return"It's past bedtime. The stars will still be here tomorrow.";
  if(h>=21&&!(v.enMin>0))return"IELTS time! 45 minutes of writing grows a tulip.";
  if(h>=22&&!(v.krMin>0))return"한국어 시간이에요! 30 minutes for the cherry tree.";
  if((v.water||0)<1&&h>=10)return"I'm a little thirsty… shall we drink a bottle together?";
  if(h>=11&&h<14&&v.coffee==null)return r.allowed?"Coffee day today. Maybe ask for less syrup?":"Warm-water day! The coffee plant is counting on you.";
  if((v.water||0)>=s.bottles)return"The whole garden is watered. Thank you!";
  if(h<10&&wakeOnTime(v.wakeAt))return"Good morning! You woke up on time, look at that sunshine.";
  return"Every little step grows something here.";
}

  else if(s.mode==="review"){const q=s.queue;const c=q[0];
    if(!c)b=`<h2>All done 🌸</h2><p>You reviewed ${s.done} card${s.done===1?"":"s"}. See you tomorrow.</p><div class="actions"><span></span><button class="btn primary" data-act="close">Close</button></div>`;
    else b=`<h2>Review · ${q.length} left</h2><div class="flash"><div class="small muted">${c.kind}</div><div class="front">${esc(c.front)}</div>${s.shown?`<div class="back"><b>${esc(c.back)}</b></div>${c.example?`<div class="small muted">${esc(c.example)}</div>`:""}`:""}</div>
    ${s.shown?`<div class="row mt" style="display:grid;grid-template-columns:repeat(4,1fr)"><button class="btn" data-act="grade" data-v="0">Again</button><button class="btn" data-act="grade" data-v="1">Hard</button><button class="btn primary" data-act="grade" data-v="2">Good</button><button class="btn" data-act="grade" data-v="3">Easy</button></div>`:`<div class="row mt"><button class="btn primary" style="flex:1" data-act="reveal">Show answer</button></div>`}<div class="actions"><span></span><button class="btn ghost" data-act="close">Stop</button></div>`}
  else if(s.mode==="write"){const e=s.essay;const wc=(e.text.trim().match(/\S+/g)||[]).length;const goal=e.task===2?250:150;
    const left=e.startedAt?Math.max(0,e.minutes*60-Math.floor((Date.now()-e.startedAt)/1000)):e.minutes*60;
    b=`<h2>IELTS Task ${e.task} ${e.startedAt?`· <span class="num" id="w-left">${pad(Math.floor(left/60))}:${pad(left%60)}</span>`:""}</h2>
    <div class="field"><label for="w-prompt">Prompt</label><textarea id="w-prompt" rows="3">${esc(e.prompt)}</textarea></div>
    <div class="row mt"><button class="btn sm ghost" data-act="newprompt">Different prompt</button>${e.startedAt?"":`<button class="btn sm primary" data-act="wstart">▶ Start ${e.minutes}-min timer</button>`}</div>
    <div class="field" style="margin-top:10px"><label for="w-text">Your answer · <span class="wc" id="w-wc">${wc}</span> / ${goal}+ words</label><textarea id="w-text" rows="12" placeholder="Write here…">${esc(e.text)}</textarea></div>
    ${s.id?`<div class="field" style="margin-top:12px"><label>Score yourself (band for each criterion)</label><div class="fields">${["TR","CC","LR","GRA"].map(k=>`<div class="field"><label for="sc-${k}">${({TR:e.task===2?"Task response":"Task achievement",CC:"Coherence & cohesion",LR:"Vocabulary",GRA:"Grammar"})[k]}</label><select id="sc-${k}">${[5,5.5,6,6.5,7,7.5,8,8.5,9].map(n=>`<option${e.scores&&e.scores[k]===n?" selected":""}>${n}</option>`).join("")}<option value=""${!e.scores?" selected":""}>—</option></select></div>`).join("")}</div></div>`:""}
    <div class="actions"><div class="row">${s.id?`<button class="btn danger" data-act="delessay">Delete</button>`:""}<button class="btn" data-act="copyessay">Copy for Claude feedback</button></div><div class="row"><button class="btn" data-act="close">Close</button><button class="btn primary" data-act="saveessay">${s.id?"Save":"Save essay 🌷"}</button></div></div>`}
  host.innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${b}</div></div>`;
  if(s.mode==="write"&&s.essay.startedAt&&!writeTick)writeTick=setInterval(()=>{const e=S.sheet&&S.sheet.essay;const el=document.getElementById("w-left");if(!e||!el)return;const l=Math.max(0,e.minutes*60-Math.floor((Date.now()-e.startedAt)/1000));el.textContent=`${pad(Math.floor(l/60))}:${pad(l%60)}`;if(l===0)el.textContent="Time's up";},1000);
}
function readWrite(){const e=S.sheet.essay;const p=document.getElementById("w-prompt"),t=document.getElementById("w-text");if(p)e.prompt=p.value;if(t)e.text=t.value}
function readCard(){const c=S.sheet.card;["front","back","ex"].forEach(k=>{const el=document.getElementById("cd-"+k);if(el)c[k==="ex"?"example":k]=el.value})}

/* ================= backup ================= */
async function saveFile(name,data,mime){const blob=new Blob([data],{type:mime});
  try{const file=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true}}catch(e){if(e&&e.name==="AbortError")return false}
  try{const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);return true}catch(_){toast("Couldn't create the file.");return false}}
async function exportBackup(){const data=JSON.stringify({app:"starlit-garden",exportedAt:new Date().toISOString(),...D},null,2);if(await saveFile(`garden-backup-${today()}.json`,data,"application/json")){D.settings.lastBackup=today();save();render();toast("Backup ready — save it to Files")}}
function readImport(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=="starlit-garden")throw 0;S.pendingImport=d;
  openSheet({mode:"import"});document.getElementById("sheet-host").innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet"><h2>Restore backup?</h2><p>This replaces everything in the app with the backup from <b>${esc(fmtD((d.exportedAt||today()).slice(0,10),true))}</b> (${Object.keys(d.days||{}).length} days, ${(d.cards||[]).length} cards, ${(d.essays||[]).length} essays).</p><div class="actions"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="doimport">Restore</button></div></div></div>`}catch(_){toast("That file isn't a Starlit Garden backup.")}};r.readAsText(file)}

/* ================= events ================= */
document.addEventListener("click",async e=>{
  const nav=e.target.closest("[data-tab]");if(nav){S.tab=nav.dataset.tab;closeSheet();render();window.scrollTo({top:0});return}
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,v=el.dataset.v,t=today(),day=getDay(t);
  if(a==="scrim"){if(e.target===el)closeSheet();return}
  switch(a){
    case"water":{const n=Math.max(0,Math.round(((day.water||0)+Number(v))*2)/2);setDay(t,{water:n});if(n>=D.settings.bottles&&(day.water||0)<D.settings.bottles)toast("Garden fully watered 💧🌱");break}
    case"coffee":setDay(t,{coffee:Number(v)});if(Number(v)===0)toast("Coffee plant is growing 🌿");break;
    case"tea":setDay(t,{tea:!day.tea});break;
    case"craving":setDay(t,{craving:Number(v)});break;
    case"steps":{const n=parseInt((document.getElementById("steps-in").value||"").replace(/[^\d]/g,""),10);if(!isFinite(n)){toast("Enter your step count.");return}setDay(t,{steps:n});if(n>=D.settings.steps)toast("A new stone on your path 🪨");break}
    case"melatonin":setDay(t,{melatonin:!day.melatonin});break;
    case"kr":setDay(t,{kr:{...(day.kr||{}),[v]:!(day.kr||{})[v]}});break;
    case"speak":startSession("speak",1);break;
    case"nextprompt":KO_PROMPTS.push(KO_PROMPTS.shift());render();break;
    case"start":startSession(v,v==="ko"?D.settings.krMin:D.settings.enMin);break;
    case"stop":stopSession();break;
    case"period-start":if(openPeriod()){toast("A period is already open.");return}D.periods.push({start:t});save();render();toast("Logged. Rest days are on 🌧️");break;
    case"period-end":{const p=openPeriod();if(p){p.end=t;save();render();toast("Period ended")}break}
    case"symptoms":openSheet({mode:"symptoms",date:t});break;
    case"day":openSheet({mode:"symptoms",date:v});break;
    case"sym":{const d=S.sheet.date,cur=getDay(d).sym||[];D.days[d]={...getDay(d),sym:cur.includes(v)?cur.filter(x=>x!==v):[...cur,v]};save();renderSheet();break}
    case"flow":{const d=S.sheet.date;D.days[d]={...getDay(d),flow:v};save();renderSheet();break}
    case"sym-save":{const d=S.sheet.date,n=document.getElementById("sym-note");D.days[d]={...getDay(d),symNote:n?n.value:""};save();closeSheet();render();break}
    case"mark-start":{if(D.periods.some(p=>p.start===v))return;D.periods.push({start:v,end:null});const p=D.periods[D.periods.length-1];if(v<t)p.end=addDays(v,avgLen()-1)<t?addDays(v,avgLen()-1):null;save();closeSheet();render();toast("Period added. Adjust the end day if needed.");break}
    case"mark-end":{const p=periodsSorted().filter(p=>p.start<=v).pop();if(!p){toast("Mark the start day first.");return}const real=D.periods.find(x=>x.start===p.start);real.end=v;save();closeSheet();render();break}
    case"remove-period":D.periods=D.periods.filter(p=>p.start!==v);save();closeSheet();render();break;
    case"cal":{const{y,m}=parseD(S.calMonth);S.calMonth=ymd(y,m+Number(v),1);render();break}
    case"studytab":S.studyTab=v;render();break;
    case"addcard":openSheet({mode:"card",card:{deck:v,kind:v==="ko"?"vocab":"phrase",front:"",back:"",example:""}});break;
    case"editcard":{const c=D.cards.find(x=>x.id===v);if(c)openSheet({mode:"card",id:v,card:{...c}});break}
    case"cardkind":readCard();S.sheet.card.kind=v;renderSheet();break;
    case"savecard":{readCard();const c=S.sheet.card;if(!c.front.trim()||!c.back.trim()){toast("Fill in both sides.");return}
      if(S.sheet.id){const i=D.cards.findIndex(x=>x.id===S.sheet.id);D.cards[i]={...D.cards[i],...c}}else{D.cards.push({...c,id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),due:t,interval:0,ease:2.5,reps:0,created:t});const k=c.deck==="ko"?"kr":null;if(k)setDay(t,{kr:{...(getDay(t).kr||{}),[c.kind==="grammar"?"grammar":"vocab"]:true}})}
      save();closeSheet();render();toast("Card saved");break}
    case"delcard":D.cards=D.cards.filter(x=>x.id!==S.sheet.id);save();closeSheet();render();break;
    case"review":openSheet({mode:"review",deck:v,queue:dueCards(v).sort(()=>Math.random()-.5),shown:false,done:0});break;
    case"reveal":S.sheet.shown=true;renderSheet();break;
    case"grade":{const s=S.sheet,c=s.queue.shift();const real=D.cards.find(x=>x.id===c.id);grade(real,Number(v));if(Number(v)===0)s.queue.push(real);s.done++;s.shown=false;
      if(s.deck==="ko")D.days[t]={...getDay(t),kr:{...(getDay(t).kr||{}),vocab:true}};save();renderSheet();render();break}
    case"write":{const task=Number(v);openSheet({mode:"write",essay:{task,minutes:task===2?40:20,prompt:promptOf(task===2?EN_T2:EN_T1,Math.floor(Math.random()*20)),text:"",startedAt:null}});break}
    case"newprompt":{readWrite();const e=S.sheet.essay;const arr=e.task===2?EN_T2:EN_T1;e.prompt=arr[(arr.indexOf(e.prompt)+1)%arr.length];renderSheet();break}
    case"wstart":readWrite();S.sheet.essay.startedAt=Date.now();renderSheet();break;
    case"openessay":{const e=D.essays.find(x=>x.id===v);if(e)openSheet({mode:"write",id:v,essay:{...e,startedAt:null}});break}
    case"saveessay":{readWrite();const s=S.sheet,e=s.essay;const words=(e.text.trim().match(/\S+/g)||[]).length;if(words<20){toast("Write a bit more before saving.");return}
      let scores=null;if(s.id){const vals=["TR","CC","LR","GRA"].map(k=>document.getElementById("sc-"+k).value);if(vals.every(x=>x!==""))scores={TR:+vals[0],CC:+vals[1],LR:+vals[2],GRA:+vals[3]}}
      const mins=e.startedAt?Math.max(1,Math.round((Date.now()-e.startedAt)/60000)):0;
      if(s.id){const i=D.essays.findIndex(x=>x.id===s.id);D.essays[i]={...D.essays[i],prompt:e.prompt,text:e.text,words,scores:scores||D.essays[i].scores}}
      else{D.essays.push({id:Date.now().toString(36),date:t,task:e.task,prompt:e.prompt,text:e.text,words,minutes:mins});if(mins)D.days[t]={...getDay(t),enMin:(getDay(t).enMin||0)+mins}}
      save();closeSheet();render();toast(s.id?"Saved":"Essay saved · a new tulip 🌷");break}
    case"delessay":D.essays=D.essays.filter(x=>x.id!==S.sheet.id);save();closeSheet();render();break;
    case"copyessay":{readWrite();const e=S.sheet.essay;const txt=`Please mark this IELTS Writing Task ${e.task} answer. My target is band ${D.settings.ieltsTarget}. Give a band for Task ${e.task===2?"Response":"Achievement"}, Coherence & Cohesion, Lexical Resource and Grammatical Range & Accuracy, list my mistakes as "wrong → right", and suggest how to reach band 8.\n\nPrompt: ${e.prompt}\n\nMy answer:\n${e.text}`;
      try{await navigator.clipboard.writeText(txt);toast("Copied — paste it into Claude")}catch(_){toast("Couldn't copy. Select the text and copy it manually.")}break}
    case"ieltsbooked":D.settings.ieltsTentative=!D.settings.ieltsTentative;save();render();break;
    case"export":await exportBackup();break;
    case"doimport":{const d=S.pendingImport;delete d.app;delete d.exportedAt;D={...structuredClone(DEFAULTS),...d,settings:{...DEFAULTS.settings,...d.settings}};save();S.pendingImport=null;closeSheet();S.tab="garden";render();toast("Backup restored 🌱");break}
    case"editday":openSheet({mode:"day",date:v,mel:!!getDay(v).melatonin});break;
    case"editday-pick":{const d=document.getElementById("fix-date").value;if(!d||d>t){toast("Pick a day up to today.");return}openSheet({mode:"day",date:d,mel:!!getDay(d).melatonin});break}
    case"ed-mel":S.sheet.mel=!S.sheet.mel;{const keep={};["ed-sleep","ed-wake","ed-water","ed-steps","ed-coffee","ed-kr","ed-en"].forEach(id=>keep[id]=document.getElementById(id).value);renderSheet();Object.entries(keep).forEach(([id,val])=>document.getElementById(id).value=val)}break;
    case"ed-clear":document.getElementById("ed-sleep").value="";document.getElementById("ed-wake").value="";S.sheet.mel=false;toast("Sleep times cleared. Tap Save to keep.");break;
    case"ed-save":{const d=S.sheet.date,g=id=>document.getElementById(id).value.trim();const num=(x,f)=>x===""?undefined:f(x.replace(/,/g,""));
      const patch={sleepAt:g("ed-sleep")||undefined,wakeAt:g("ed-wake")||undefined,water:num(g("ed-water"),parseFloat),steps:num(g("ed-steps"),x=>parseInt(x,10)),coffee:g("ed-coffee")===""?undefined:Number(g("ed-coffee")),krMin:num(g("ed-kr"),x=>parseInt(x,10)),enMin:num(g("ed-en"),x=>parseInt(x,10)),melatonin:S.sheet.mel||undefined};
      for(const[k,val]of Object.entries(patch))if(val!==undefined&&!isFinite(val)&&typeof val==="number"){toast("Check the numbers.");return}
      const cur={...getDay(d)};for(const[k,val]of Object.entries(patch)){if(val===undefined)delete cur[k];else cur[k]=val}
      D.days[d]=cur;save();closeSheet();render();toast("Day updated");break}
    case"close":closeSheet();break;
  }
});
document.addEventListener("input",e=>{if(e.target.id==="w-text"){const n=(e.target.value.trim().match(/\S+/g)||[]).length;const el=document.getElementById("w-wc");if(el)el.textContent=n;if(S.sheet&&S.sheet.essay)S.sheet.essay.text=e.target.value}});
document.addEventListener("change",e=>{const el=e.target;const t=today();
  if(el.id==="import-file"){const f=el.files&&el.files[0];if(f)readImport(f);el.value="";return}
  if(el.dataset.sleep){setDay(t,{[el.dataset.sleep]:el.value});return}
  if(el.dataset.set){const k=el.dataset.set;let val=el.value;if(["bottles","bottleMl","steps","coffeePrice","krMin","enMin","ieltsTarget"].includes(k)){val=parseFloat(String(val).replace(/,/g,""));if(!isFinite(val)||val<=0){toast("Enter a number above zero.");render();return}}
    if(k==="topikRegStart")D.settings.topikRegEnd=addDays(val,6);D.settings[k]=val;save();toast("Saved");return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.sheet)closeSheet()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});

/* ================= boot ================= */
try{localStorage.setItem("__t","1");localStorage.removeItem("__t")}catch(_){storageOk=false}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
render();
if(!storageOk)document.getElementById("view").insertAdjacentHTML("afterbegin",`<div class="banner star">This browser is blocking storage, so nothing can be saved. Turn off private browsing and open the app again.</div>`);
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
